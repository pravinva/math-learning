<script>
const E=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cpp=s=>`<pre><code class="language-cpp">${E(s.trim())}</code></pre>`;
const bash=s=>`<pre><code class="language-bash">${E(s.trim())}</code></pre>`;
const plain=s=>`<pre><code class="language-plaintext">${E(s.trim())}</code></pre>`;
const note=s=>`<div class="note">${s}</div>`;
const tip=s=>`<div class="tip">${s}</div>`;

const S=[
{h:1,t:'1.1  Compilation model',c:`<h2>Compilation model</h2>
${plain('source.cpp → [preprocessor] → [compiler] → source.o → [linker] → executable')}
${bash('g++ -std=c++17 -Wall -O2 main.cpp -o main\n./main')}
<p>The preprocessor handles <code>#include</code>, <code>#define</code>, <code>#ifdef</code>. The linker combines <code>.o</code> files and resolves symbols across translation units.</p>
${note('Understanding this model explains why header files exist and why you get "undefined reference" errors.')}`},

{h:1,t:'1.2  Basic types',c:`<h2>Basic types</h2>
${cpp(`bool b = true;
char c = 'A';           // 1 byte
int i = 42;             // typically 4 bytes
long long ll = 1LL;     // at least 8 bytes
float f = 3.14f;        // 4 bytes, ~7 significant digits
double d = 3.14;        // 8 bytes, ~15 significant digits
unsigned int u = 42u;`)}
<p>Prefer <code>int</code> for integers unless you have a size reason. Prefer <code>double</code> over <code>float</code>. For guaranteed sizes use <code>&lt;cstdint&gt;</code>: <code>int32_t</code>, <code>uint64_t</code>, etc.</p>
${note('Implicit conversions are the enemy. Enable <code>-Wall</code> and pay attention to narrowing warnings.')}`},

{h:1,t:'1.3  Variables, const, auto',c:`<h2>Variables, const, auto</h2>
${cpp(`int x = 5;
const int y = 10;       // y is immutable
auto z = x + y;         // deduced: int

const auto& r = x;      // const lvalue ref — no copy, can't modify via r`)}
<p><code>auto</code> strips top-level const and refs. Use <code>const auto&</code> when you want to observe without copying.</p>`},

{h:1,t:'1.4  Pointers and references',c:`<h2>Pointers and references</h2>
${cpp(`int x = 10;
int* p = &x;        // pointer: stores address of x
*p = 20;            // dereference: modifies x
p = nullptr;        // null pointer — never use NULL or 0

int& ref = x;       // reference: alias for x — cannot be reseated
ref = 30;           // modifies x directly`)}
${tip('Prefer references unless you need nullability or pointer arithmetic.')}`},

{h:1,t:'1.5  Control flow',c:`<h2>Control flow</h2>
${cpp(`// range-for (prefer this for containers)
std::vector<int> v = {1, 2, 3};
for (auto x : v)        { /* copy   */ }
for (auto& x : v)       { /* by ref */ }
for (const auto& x : v) { /* read-only */ }

// traditional for
for (int i = 0; i < 10; ++i) { ... }

// switch
switch (x) {
    case 1: ...; break;
    case 2: ...; break;
    default: ...;
}`)}
<p>Standard <code>if/else if/else</code>, <code>while</code>, <code>do/while</code> are identical to other C-family languages.</p>`},

{h:1,t:'1.6  Functions',c:`<h2>Functions</h2>
${cpp(`int add(int a, int b) { return a + b; }

// default arguments
void log(std::string msg, bool verbose = false) { ... }

// pass by value, by ref, by const ref
void byVal(int x)              { x = 0; }  // caller unchanged
void byRef(int& x)             { x = 0; }  // modifies caller
void byConstRef(const std::string& s);      // no copy, no modify

// structured bindings (C++17)
std::pair<int, bool> tryParse(const std::string& s) { ... }
auto [val, ok] = tryParse("42");`)}
<p>Function overloading is allowed — same name, different parameter types. The compiler selects the best viable overload.</p>`},

{h:1,t:'1.7  Namespaces',c:`<h2>Namespaces</h2>
${cpp(`namespace math {
    double pi = 3.14159;
    double square(double x) { return x * x; }
}

math::square(3.0);

using namespace math;  // pulls everything in — avoid in headers
using math::pi;        // selective — preferred`)}
${note('<code>std::</code> is the standard library namespace. Never <code>using namespace std;</code> in a header — it pollutes every file that includes it.')}`},

{h:2,t:'2.1  Stack vs heap',c:`<h2>Stack vs heap</h2>
${cpp(`// Stack — automatic duration, fast allocation
int x = 5;

// Heap — raw (avoid in modern C++)
int* p = new int(5);
delete p;               // must manually free — easy to leak

// Heap — managed (prefer always)
#include <memory>
auto sp = std::make_unique<int>(5);   // freed when sp goes out of scope
auto sh = std::make_shared<int>(5);   // reference-counted`)}
<h3>When to use heap</h3>
<ul>
  <li>Object lifetime must extend beyond current scope</li>
  <li>Size determined at runtime</li>
  <li>Large objects (stack is typically 1–8 MB)</li>
</ul>`},

{h:2,t:'2.2  RAII',c:`<h2>RAII — the central idiom</h2>
<p>Resource Acquisition Is Initialisation. Resources are tied to object lifetime. Constructor acquires, destructor releases.</p>
${cpp(`{
    std::unique_ptr<int> p = std::make_unique<int>(42);
    // use p...
}   // destructor runs here — freed automatically, even on exception`)}
${note('Smart pointers, <code>std::vector</code>, <code>std::fstream</code> all implement RAII. If you are calling <code>delete</code> manually, you are almost certainly doing something wrong.')}
<p>RAII is what makes C++ memory safe in practice without a GC. Stack unwinding during exceptions runs all destructors on the way out — RAII and exceptions compose cleanly.</p>`},

{h:2,t:'2.3  Classes',c:`<h2>Classes</h2>
${cpp(`class Point {
public:
    double x, y;

    Point(double x, double y) : x(x), y(y) {}

    double norm() const { return std::sqrt(x*x + y*y); }  // const: no modify

    Point operator+(const Point& o) const { return {x+o.x, y+o.y}; }
};

Point p{3.0, 4.0};
std::cout << p.norm();  // 5.0`)}
<h3>Access specifiers</h3>
<ul>
  <li><code>public</code> — accessible from anywhere</li>
  <li><code>private</code> — class-internal only (default for <code>class</code>)</li>
  <li><code>protected</code> — class and derived classes</li>
</ul>
${tip('<code>struct</code> vs <code>class</code>: identical except default access is <code>public</code>. Use struct for plain data, class for types with invariants.')}`},

{h:2,t:'2.4  Rule of Five (and Zero)',c:`<h2>Rule of Five (and Zero)</h2>
<p>When your class manages a resource, define or explicitly delete all five special members:</p>
${cpp(`class Buffer {
    int* data; size_t size;
public:
    Buffer(size_t n) : data(new int[n]), size(n) {}
    ~Buffer() { delete[] data; }                                    // destructor

    Buffer(const Buffer& o) : data(new int[o.size]), size(o.size)   // copy ctor
        { std::copy(o.data, o.data+size, data); }

    Buffer& operator=(const Buffer& o) {                            // copy assign
        if (this != &o) { delete[] data; data = new int[o.size];
            size = o.size; std::copy(o.data, o.data+size, data); }
        return *this; }

    Buffer(Buffer&& o) noexcept : data(o.data), size(o.size)        // move ctor
        { o.data = nullptr; o.size = 0; }

    Buffer& operator=(Buffer&& o) noexcept {                        // move assign
        if (this != &o) { delete[] data; data = o.data; size = o.size;
            o.data = nullptr; o.size = 0; }
        return *this; }
};`)}
${note('<strong>Rule of Zero:</strong> if your class only holds RAII objects (smart pointers, vectors), the compiler-generated defaults are correct — define none of the five.')}`},

{h:2,t:'2.5  Standard containers',c:`<h2>Standard containers</h2>
${cpp(`std::vector<int> v = {1, 2, 3};
v.push_back(4);
v.emplace_back(5);           // construct in-place — no copy
v[0]; v.at(0);               // at() bounds-checks; [] does not

std::array<int, 4> a = {1, 2, 3, 4};    // fixed size, stack allocated

std::map<std::string, int> m;
m["key"] = 1;
m.count("key"); m.find("key");

std::unordered_map<std::string, int> um; // hash map — O(1) avg vs O(log n)

std::string s = "hello";
s += " world";
s.size(); s.substr(0, 5); s.find("world");`)}
<h3>Which to use</h3>
<ul>
  <li><code>vector</code> — default. Contiguous, cache-friendly, amortised O(1) push</li>
  <li><code>unordered_map</code> — O(1) average key lookup</li>
  <li><code>map</code> — O(log n), use only when you need sorted iteration</li>
  <li><code>array</code> — compile-time fixed size, stack allocated</li>
</ul>`},

{h:2,t:'2.6  Iterators and algorithms',c:`<h2>Iterators and algorithms</h2>
${cpp(`#include <algorithm>
#include <numeric>

std::vector<int> v = {3, 1, 4, 1, 5, 9};

std::sort(v.begin(), v.end());
std::sort(v.begin(), v.end(), std::greater<int>{});

auto it = std::find(v.begin(), v.end(), 4);
if (it != v.end()) { /* found */ }

int sum = std::accumulate(v.begin(), v.end(), 0);
int mx  = *std::max_element(v.begin(), v.end());

// erase-remove idiom
v.erase(std::remove(v.begin(), v.end(), 1), v.end());`)}
<p><code>begin()</code> points to the first element; <code>end()</code> points one past the last. Algorithms work on iterator ranges and don't care about the underlying container type.</p>`},

{h:2,t:'2.7  Lambdas',c:`<h2>Lambdas</h2>
${cpp(`auto square = [](int x) { return x * x; };
square(4);  // 16

int offset = 10;
auto byVal = [offset](int x) { return x + offset; };   // capture by value
auto byRef = [&offset](int x) { return x + offset; };  // capture by reference

auto g = [&](int x) { return x + offset; };  // capture all by ref — careful with lifetime

std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });
std::transform(v.begin(), v.end(), v.begin(), [](int x) { return x * 2; });`)}
${note('Lambdas are syntactic sugar for anonymous structs with <code>operator()</code>. The capture list becomes member variables of that struct.')}`},

{h:3,t:'3.1  Templates',c:`<h2>Templates</h2>
${cpp(`template<typename T>
T maximum(T a, T b) { return a > b ? a : b; }

maximum(3, 5);      // T deduced as int
maximum(3.0, 5.0);  // T deduced as double

template<typename T>
class Stack {
    std::vector<T> data;
public:
    void push(const T& val) { data.push_back(val); }
    T pop() { T v = data.back(); data.pop_back(); return v; }
    bool empty() const { return data.empty(); }
};

Stack<int> s;
s.push(1); s.push(2);`)}
<p>Templates are compile-time. The compiler generates a concrete instantiation for each type used — no runtime dispatch. Template errors produce notorious messages; C++20 concepts address this.</p>`},

{h:3,t:'3.2  Inheritance and polymorphism',c:`<h2>Inheritance and polymorphism</h2>
${cpp(`class Shape {
public:
    virtual double area() const = 0;   // pure virtual — Shape is abstract
    virtual ~Shape() {}                // virtual destructor — ALWAYS on polymorphic bases
};

class Circle : public Shape {
    double r;
public:
    Circle(double r) : r(r) {}
    double area() const override { return 3.14159 * r * r; }
};

std::vector<std::unique_ptr<Shape>> shapes;
shapes.push_back(std::make_unique<Circle>(3.0));
shapes.push_back(std::make_unique<Rect>(4.0, 5.0));

for (const auto& s : shapes)
    std::cout << s->area() << "\\n";`)}
${tip('<code>override</code> is optional but use it always — it catches typos and signature mismatches at compile time.')}`},

{h:3,t:'3.3  Exceptions',c:`<h2>Exceptions</h2>
${cpp(`#include <stdexcept>

double divide(double a, double b) {
    if (b == 0) throw std::invalid_argument("division by zero");
    return a / b;
}

try {
    double r = divide(10.0, 0.0);
} catch (const std::invalid_argument& e) {
    std::cerr << e.what() << "\\n";
} catch (const std::exception& e) {
    // catches anything derived from std::exception
} catch (...) {
    // catch everything — last resort
}`)}
${note('Mark functions that will never throw with <code>noexcept</code>. Required for move constructors to be used in container resizes.')}`},

{h:3,t:'3.4  Error handling',c:`<h2>Error handling philosophy</h2>
${cpp(`#include <optional>

std::optional<int> safeParse(const std::string& s) {
    try { return std::stoi(s); }
    catch (...) { return std::nullopt; }
}

auto result = safeParse("abc");
if (result) std::cout << *result;

// C++23: std::expected<int, std::string> — Rust-style Result<T,E>`)}
<h3>Rough guide</h3>
<ul>
  <li>Exceptions — default for application code where errors are genuinely exceptional</li>
  <li><code>optional</code> — absence is a normal result, not an error</li>
  <li>Return codes — performance-critical paths, embedded, C interop</li>
  <li><code>expected</code> — propagate error detail without exceptions (C++23)</li>
</ul>`},

{h:3,t:'3.5  Move semantics',c:`<h2>Move semantics in practice</h2>
${cpp(`std::vector<std::string> v;

std::string s = "hello";
v.push_back(s);               // copy — s still valid
v.push_back(std::move(s));    // move — s in valid but unspecified state

// NRVO: Named Return Value Optimisation
std::vector<int> makeVec() {
    std::vector<int> v = {1, 2, 3};
    return v;   // no copy — NRVO applies
}`)}
${note('<code>std::move</code> doesn\'t move anything. It casts to an rvalue reference, signalling that the object\'s resources can be stolen by the receiving constructor.')}`},

{h:3,t:'3.6  constexpr',c:`<h2>constexpr</h2>
${cpp(`constexpr int factorial(int n) {
    return n <= 1 ? 1 : n * factorial(n - 1);
}

constexpr int f5 = factorial(5);   // 120 — computed at compile time

constexpr double PI = 3.14159265358979;

// constexpr if (C++17) — branch resolved at compile time
template<typename T>
auto process(T val) {
    if constexpr (std::is_integral_v<T>) return val * 2;
    else return val * 2.0;
}`)}
<p><code>constexpr</code> functions run at compile time when called with compile-time arguments, at runtime otherwise. Always prefer over <code>#define</code> for constants.</p>`},

{h:3,t:'3.7  I/O',c:`<h2>I/O</h2>
${cpp(`#include <iostream>
#include <fstream>
#include <sstream>

std::cout << "hello " << 42 << "\\n";
std::cerr << "error\\n";

int x; std::cin >> x;

std::ifstream in("data.txt");
std::string line;
while (std::getline(in, line)) { /* process */ }

std::ofstream out("out.txt");
out << "writing to file\\n";

std::ostringstream ss;
ss << "value=" << 42;
std::string result = ss.str();   // "value=42"`)}
`},

{h:3,t:'3.8  Compilation flags',c:`<h2>Compilation flags</h2>
${bash(`g++ -std=c++17            # C++17 (or c++20, c++23)
    -Wall -Wextra        # enable most warnings
    -Werror              # treat warnings as errors
    -O2                  # optimise for release
    -g                   # include debug symbols
    -fsanitize=address,undefined   # ASan + UBSan
    -o output`)}
${tip('Run all tests under <code>-fsanitize=address,undefined</code> during development. Catches use-after-free, buffer overflow, and undefined behaviour with minimal code changes.')}`},

{h:4,t:"What's next",c:`<h2>What to learn next</h2>
<h3>Immediate</h3>
<ul>
  <li><code>std::string_view</code> — non-owning string reference, avoids copies</li>
  <li><code>std::span</code> (C++20) — non-owning view over contiguous data</li>
  <li><code>std::variant</code>, <code>std::any</code> — type-safe unions</li>
  <li>Header files and <code>#pragma once</code></li>
</ul>
<h3>Intermediate</h3>
<ul>
  <li>Template metaprogramming, SFINAE, and concepts (C++20)</li>
  <li>Perfect forwarding and variadic templates</li>
  <li><code>&lt;ranges&gt;</code> (C++20) — composable lazy pipelines</li>
  <li>Custom allocators</li>
</ul>

];

const HM={1:'Hour 1 — Language substrate',2:'Hour 2 — Memory and STL',3:'Hour 3 — Templates and patterns',4:'Reference'};
const HB={1:'Hour 1',2:'Hour 2',3:'Hour 3',4:'Ref'};
const nav=document.getElementById('nav-inner');
let ph=0;
S.forEach((s,i)=>{
  if(s.h!==ph){ph=s.h;const l=document.createElement('div');l.className='hlabel';l.textContent=HM[s.h];nav.appendChild(l);}
  const el=document.createElement('div');
  el.className='nitem';el.dataset.i=i;
  el.innerHTML=`<span class="ndot"></span>${s.t}`;
  el.onclick=()=>show(i);
  nav.appendChild(el);
});

function show(i){
  const s=S[i];
  const prev=i>0?`<div class="fb" onclick="show(${i-1})">← ${S[i-1].t}</div>`:`<div class="fb off">←</div>`;
  const next=i<S.length-1?`<div class="fb" onclick="show(${i+1})">${S[i+1].t} →</div>`:`<div class="fb off">→</div>`;
  document.getElementById('main').innerHTML=s.c+`<div id="fnav">${prev}${next}</div>`;
  document.querySelectorAll('.nitem').forEach(el=>el.classList.toggle('active',+el.dataset.i===i));
  const a=document.querySelector('.nitem.active');
  if(a)a.scrollIntoView({block:'nearest'});
  document.getElementById('main').scrollTop=0;
  document.getElementById('pfill').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('prog-label').textContent=`${i+1} / ${S.length}`;
  document.getElementById('hour-badge').textContent=HB[s.h];
  document.getElementById('section-title').textContent=s.t;
  document.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
}
show(0);
</script>
