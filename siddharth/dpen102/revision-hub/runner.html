<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DPEN102 revision set runner with questions and fully worked answers.">
  <title>DPEN102 Revision Runner</title>
  <script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]]},svg:{fontCache:"global"}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="families-foundations.js"></script>
  <script defer src="families-structures.js"></script>
  <script defer src="families-applied.js"></script>
  <script defer src="curriculum.js"></script>
  <script defer src="core.js"></script>
  <style>
    :root{--ink:#10223b;--muted:#5b6879;--paper:#f5f7fb;--card:#fff;--navy:#173b68;--blue:#2463a7;--sky:#e8f2ff;--gold:#f2b84b;--line:#dce3ed;--ok:#176b52}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:var(--blue)}button,.button{border:0;border-radius:.65rem;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:.7rem 1rem;text-decoration:none;cursor:pointer}
    .topbar{background:#0e294a;color:#fff}.topbar-inner{max-width:1040px;margin:auto;padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}.topbar a{color:#fff;text-decoration:none}.brand{font-weight:850;letter-spacing:.03em}.mode-link{border:1px solid #88add7;border-radius:.55rem;padding:.42rem .72rem}
    main{max-width:900px;margin:auto;padding:2rem 1.2rem 5rem}.runner-head{background:linear-gradient(130deg,#173b68,#245b93);color:#fff;border-radius:1.2rem;padding:clamp(1.4rem,4vw,2.7rem);box-shadow:0 16px 36px #173b6820}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;font-weight:800;color:#bcdcff}.runner-head h1{margin:.25rem 0;font-size:clamp(1.8rem,5vw,3rem);line-height:1.12}.runner-head p{margin:.55rem 0 0;color:#e3eefb}.meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}.pill{background:#ffffff19;border:1px solid #ffffff30;border-radius:100px;padding:.3rem .7rem;font-size:.86rem}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin:1.3rem 0}.toolbar p{margin:0;color:var(--muted)}.toolbar-actions{display:flex;gap:.5rem}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}
    .set-title{display:flex;align-items:center;gap:.7rem;margin:2.5rem 0 1rem}.set-title span{display:grid;place-items:center;width:2.15rem;height:2.15rem;border-radius:.6rem;background:var(--gold);font-weight:900}.set-title h2{margin:0}
    .questions{display:grid;gap:1rem}.question-card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;box-shadow:0 5px 18px #173b6809;min-width:0;overflow:hidden}.question-heading{display:flex;align-items:center;justify-content:space-between;gap:.6rem}.question-number{font-weight:900;color:var(--blue)}.question-tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:#eef2f7;border-radius:100px;padding:.25rem .55rem}.prompt{font-size:1.04rem;margin:.8rem 0 0;overflow-wrap:anywhere}
    details{margin-top:1rem;border-top:1px solid var(--line);padding-top:.8rem}summary{cursor:pointer;color:var(--blue);font-weight:800}.answer-body{margin-top:1rem}.diagram-wrap{width:100%;overflow-x:auto;overscroll-behavior-inline:contain;background:#f8fbff;border:1px solid #dce9f7;border-radius:.75rem;padding:.5rem}.mechanics-diagram{display:block;width:100%;min-width:320px;max-height:245px;color:#173b68}.diagram-line{stroke:#173b68;stroke-width:3}.diagram-line.heavy{stroke-width:7}.diagram-line.dashed{stroke-dasharray:8 6}.diagram-accent{stroke:#d28b13;stroke-width:4;fill:none}.diagram-body{fill:#e8f2ff;stroke:#173b68;stroke-width:3}.diagram-hole{fill:#fff;stroke:#173b68;stroke-width:3}.diagram-joint{fill:#f2b84b;stroke:#173b68;stroke-width:2}.diagram-label{font-size:13px;font-weight:700;fill:#173b68}.steps{padding-left:1.45rem}.steps li{margin:.55rem 0}.final,.check{border-radius:.65rem;padding:.75rem .9rem}.final{background:#fff4d8;border-left:4px solid var(--gold);font-weight:800}.check{background:#e9f7f2;border-left:4px solid var(--ok);color:#125642}
    .error{background:#fff0f0;border:1px solid #e9b6b6;color:#8b2020;border-radius:.8rem;padding:1rem}.footer-note{text-align:center;color:var(--muted);margin-top:3rem}
    @media(max-width:560px){main{padding-inline:.8rem}.topbar-inner{padding-inline:.8rem}.runner-head{border-radius:.85rem}.question-card{padding:1rem}.toolbar{align-items:flex-start}.toolbar-actions{width:100%}.toolbar-actions>*{flex:1;text-align:center}}
    @media print{body{background:#fff}.topbar,.toolbar,.footer-note{display:none}.runner-head{color:#000;background:none;box-shadow:none;padding:0}.runner-head p,.eyebrow{color:#333}.question-card{break-inside:avoid;box-shadow:none}details{display:block}details>.answer-body{display:block!important}.set-title{break-after:avoid}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">DPEN102 · Revision Hub</a><a id="mode-link" class="mode-link" href="#">Switch mode</a></div></header>
  <main>
    <section id="runner-head" class="runner-head" aria-labelledby="page-title"></section>
    <div class="toolbar">
      <p id="instructions"></p>
      <div class="toolbar-actions"><button id="expand" class="secondary" hidden>Expand all</button><button type="button" onclick="window.print()">Print</button></div>
    </div>
    <div id="content" aria-live="polite"></div>
    <p class="footer-note">DPEN102 · Twenty-week revision programme</p>
  </main>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const weekNumber = Number(params.get("week"));
      const setsCode = (params.get("sets") || "").toUpperCase();
      const mode = (params.get("mode") || "").toLowerCase();
      const validSets = new Set(["AB","AC","BC","A","B","C"]);
      const validMode = new Set(["questions","answers"]);
      const content = document.querySelector("#content");
      const core = window.DPEN102_CORE;
      const curriculum = window.DPEN102_CURRICULUM;

      if (!Number.isInteger(weekNumber) || weekNumber < 1 || weekNumber > 20 || !validSets.has(setsCode) || !validMode.has(mode) || !core || !curriculum) {
        content.append(core?.el("div","error","Invalid revision link. Choose a valid week, set selection and mode from the hub.") || document.createTextNode("Invalid revision link."));
        document.querySelector("#runner-head").append(Object.assign(document.createElement("h1"), {textContent:"Revision link unavailable"}));
        document.querySelector("#mode-link").hidden = true;
        return;
      }

      const week = curriculum[weekNumber - 1];
      const answerMode = mode === "answers";
      const head = document.querySelector("#runner-head");
      head.append(
        core.el("div","eyebrow",`${week.phase} · Week ${week.number}`),
        Object.assign(core.el("h1","",week.title), {id:"page-title"}),
        core.el("p","",week.focus)
      );
      const meta = core.el("div","meta");
      meta.append(core.el("span","pill",`Set${setsCode.length > 1 ? "s" : ""} ${setsCode.split("").join(" + ")}`), core.el("span","pill",`${setsCode.length * 12} questions`), core.el("span","pill",answerMode ? "Worked answers" : "Questions only"));
      head.append(meta);

      document.title = `Week ${week.number} · Set${setsCode.length > 1 ? "s" : ""} ${setsCode} · DPEN102`;
      document.querySelector("#instructions").textContent = answerMode ? "Mark each method, units and final result after completing both sets." : "Allow 60–75 minutes per set. Do not open the answers until both sets are complete.";
      const opposite = answerMode ? "questions" : "answers";
      const modeLink = document.querySelector("#mode-link");
      modeLink.href = `?week=${week.number}&sets=${setsCode}&mode=${opposite}`;
      modeLink.textContent = answerMode ? "View questions only" : "Open worked answers";

      try {
        setsCode.split("").forEach((variant, setIndex) => {
          const section = core.el("section","set-section");
          const title = core.el("div","set-title");
          title.append(core.el("span","",variant), core.el("h2","",`Set ${variant} · 12 questions`));
          const questions = core.el("div","questions");
          week.families.forEach((familyId, index) => questions.append(core.renderCard({
            familyId,
            seed: core.seedFor(week.number, index + 1, variant),
            variant,
            number: setIndex * 12 + index + 1,
            showAnswer: answerMode
          })));
          section.append(title, questions);
          content.append(section);
        });
        core.typeset(content);
      } catch (error) {
        content.replaceChildren(core.el("div","error",error.message));
      }

      if (answerMode) {
        const expand = document.querySelector("#expand");
        expand.hidden = false;
        expand.addEventListener("click", () => {
          const details = [...document.querySelectorAll("details")];
          const shouldOpen = details.some((item) => !item.open);
          details.forEach((item) => { item.open = shouldOpen; });
          expand.textContent = shouldOpen ? "Collapse all" : "Expand all";
        });
      }
    });
  </script>
</body>
</html>
