<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGG100 / Statics — 8-Week Study Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1F3A;
    --navy-light: #1B3A66;
    --red: #FF3621;
    --paper: #FFFFFF;
    --grid: #E3E9F2;
    --muted: #5C6B82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    color: var(--navy);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 32px 24px;
    border-bottom: 6px solid var(--red);
  }
  header h1 {
    font-family: 'Barlow', sans-serif;
    font-weight: 800;
    font-size: 1.9rem;
    margin: 0 0 6px 0;
  }
  header p {
    margin: 0;
    color: #C7D3E8;
    font-size: 0.95rem;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

  .progress-bar-track {
    background: var(--grid);
    border: 1px solid var(--navy-light);
    height: 14px;
    margin-top: 18px;
    position: relative;
  }
  .progress-bar-fill {
    background: var(--red);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    color: #C7D3E8;
    font-size: 0.85rem;
    margin-top: 6px;
  }

  .week {
    margin-top: 40px;
    border: 1px solid var(--navy-light);
    background: rgba(255,255,255,0.9);
  }
  .week-head {
    background: var(--navy-light);
    color: white;
    padding: 14px 18px;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .week-head span.hours {
    font-family: 'Roboto', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    color: #C7D3E8;
  }

  .block {
    border-top: 1px solid var(--grid);
    padding: 16px 18px;
  }
  .block-title-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    cursor: pointer;
  }
  .block-title-row input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--red); margin-top: 2px; flex-shrink: 0;
  }
  .block-title {
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 1.02rem;
  }
  .block-time {
    color: var(--red);
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
    margin-left: auto;
  }
  .block ul {
    margin: 10px 0 0 30px;
    padding: 0;
    font-size: 0.94rem;
    line-height: 1.55;
  }
  .block.done .block-title { text-decoration: line-through; color: var(--muted); }

  .reminder {
    margin: 12px 0 0 30px;
    background: #FFF3F1;
    border-left: 3px solid var(--red);
    padding: 8px 12px;
    font-size: 0.87rem;
    color: var(--navy);
  }
  .reminder strong { color: var(--red); }

  .milestone-tag {
    display: inline-block;
    background: var(--red);
    color: white;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    margin-left: 8px;
    font-family: 'Barlow', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 50px;
  }
</style>
</head>
<body>

<header>
  <div class="wrap" style="padding:0;">
    <h1>Statics / ENGG100 — 8-Week Study Plan</h1>
    <p>56 hours total &middot; 25 blocks &middot; Weeks 1&ndash;8, checkpoint to full UOW syllabus</p>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 of 25 blocks complete</div>
  </div>
</header>

<div class="wrap" id="planRoot"></div>

<footer>Tick a block once it's done &mdash; progress saves automatically on this device.</footer>

<script>
const plan = [
  { week: "Week 1: FBDs & Equilibrium Foundations", hours: "Hours 1–7", blocks: [
    { id:"b1", title:"Big Picture Mapping", time:"1.5 hrs", steps:[
      "Open 0 START HERE: Big Picture Mental Map",
      "Review subject flow and topic connections",
      "Explore Module 1 Interactive Simulations for 20 minutes"
    ]},
    { id:"b2", title:"Support Reactions Concept", time:"2 hrs", steps:[
      "Open the 8 Free Body Diagrams (FBD) Lesson",
      "Study the rigid force isolation rules",
      "Print the 6 Intuitive Formula Sheet as an anchor"
    ]},
    { id:"b3", title:"Pure Visual FBD Practice", time:"2 hrs", steps:[
      "Pick 5 problems from ENG102 Lecture Notes (W2A)",
      "Draw only naked force arrows on paper — zero math",
      "Cross-verify using the guide's worked diagram cases"
    ]},
    { id:"b4", title:"Hanson Video Alignment", time:"1.5 hrs", steps:[
      "Open 10 Jeff Hanson Statics Cross-Reference",
      "Match favourite Hanson FBD video notes to UOW conventions",
      "Confirm sign conventions match the syllabus requirements"
    ], reminder:"Sign convention mismatches here are the single most common source of mark loss later — lock this in before moving to vectors." },
  ]},
  { week: "Week 2: Vectors & The First Milestone", hours: "Hours 8–14", blocks: [
    { id:"b5", title:"Vector Resolution Review", time:"2 hrs", steps:[
      "Open W3 Vectors & Components lecture notes",
      "Review right-angled triangle trigonometry basics",
      "Practice breaking forces into X/Y components"
    ]},
    { id:"b6", title:"Mixed Concept Drills", time:"2 hrs", steps:[
      "Access the 7 Revision and Practice section",
      "Complete introductory statics concept checks",
      "Limit to 3 problems per session to avoid fatigue"
    ]},
    { id:"b7", title:"The Milestone Speedrun", time:"3 hrs", steps:[
      "Open R1 Revision Pack W1-3",
      "Solve all 24 foundational questions",
      "Use a paper mask to hide extra questions",
      "Lock in the first perfect milestone score"
    ], milestone:"Milestone 1" },
  ]},
  { week: "Week 3: Beams & Internal Actions", hours: "Hours 15–21", blocks: [
    { id:"b8", title:"Introduction to Beam Stress", time:"2 hrs", steps:[
      "Open W4 Stress/Strain/Internal Actions notes",
      "Read how internal axial, shear, and bending forces protect materials from cracking",
      "Match concepts to Jeff Hanson's internal loading chapters via the 10 Cross-Reference PDF"
    ]},
    { id:"b9", title:"Deciphering the Diagrams", time:"3 hrs", steps:[
      "Open W5 SFD + BMD notes",
      "Practice drawing simple shear profiles for point loads (sharp step-drops)",
      "Use the 6 Intuitive Formula Sheet to double-check sign conventions"
    ]},
    { id:"b10", title:"The Zero-Shear Game", time:"2 hrs", steps:[
      "Pick 3 beam problems from the textbook",
      "Calculate only the coordinate locations where shear crosses zero",
      "Highlight those spots as the future peaks for the BMD"
    ], reminder:"This is exactly the concept the I-beam build project (separate build plan) makes physical — good candidate to build right after this week." },
  ]},
  { week: "Week 4: The Truss Cutting Phase", hours: "Hours 22–28", blocks: [
    { id:"b11", title:"Method of Joints & Zero-Force Check", time:"2 hrs", steps:[
      "Review isolating individual truss nodes as tiny independent FBD circles",
      "Memorise the visual patterns that reveal Zero Force Members instantly"
    ]},
    { id:"b12", title:"Method of Sections Mastery", time:"3 hrs", steps:[
      "Open W6 Truss Method of Sections notes",
      "Master the Samurai Cut rule: cut through a maximum of 3 unknown steel bars",
      "Practice choosing the \"easy side\" of the cut to reduce calculation steps"
    ], reminder:"See the separate Build Plan document for the full Samurai Cut explainer — walk through it with him before this block." },
    { id:"b13", title:"Phase 2 Milestone Test", time:"2 hrs", steps:[
      "Open R2 Revision Pack W4-6 (24 Questions)",
      "Clear the problems using a paper mask over his workspace to keep focus sharp"
    ], milestone:"Milestone 2 · End of Phase 2" },
  ]},
  { week: "Week 5: Friction & Section Properties", hours: "Hours 29–35", blocks: [
    { id:"b14", title:"Slipping Systems", time:"3 hrs", steps:[
      "Open W7 Friction Systems notes",
      "Master inclined plane equations: Fs = μs · N",
      "Work through 4 multi-block friction problems to see how normal forces shift"
    ]},
    { id:"b15", title:"Finding the Balance Point (Centroids)", time:"2 hrs", steps:[
      "Open W8 Centroids + Inertia notes",
      "Use the composite area method to locate the exact centre coordinate (x̄, ȳ) of L-beams"
    ]},
    { id:"b16", title:"Parallel Axis Theorem Drill", time:"2 hrs", steps:[
      "Study how holes affect structural stiffness (Second Moment of Area)",
      "Memorise the shifting formula: Ix = Ix' + A·dy²"
    ]},
  ]},
  { week: "Week 6: Mechanical Energy & Consolidation", hours: "Hours 36–42", blocks: [
    { id:"b17", title:"Work & Energy Loops", time:"2 hrs", steps:[
      "Open W9 Work + Energy notes",
      "Review conservative path mechanics using potential energy changes: ΔPE = mgh"
    ]},
    { id:"b18", title:"Integrated Statics Practice", time:"3 hrs", steps:[
      "Open W10 Integrated Statics Practice",
      "Work through problems mixing multiple concepts on a single canvas layout"
    ]},
    { id:"b19", title:"Phase 3 Revision Run", time:"2 hrs", steps:[
      "Complete R3 Revision Pack W7-9 (24 Questions)",
      "Stop immediately if fatigue sets in — treat as an evaluation run, not a perfect-score sprint"
    ], milestone:"End of Phase 3" },
  ]},
  { week: "Week 7: The No-Math Strategy Run", hours: "Hours 43–49", blocks: [
    { id:"b20", title:"Exam Blueprint Analysis", time:"2 hrs", steps:[
      "Open 2 Assessment Roadmap & Weekly Plan + 4 Subject Outline",
      "Mark down the exact mark allocations for each exam paper section"
    ]},
    { id:"b21", title:"FBD Extraction Drills", time:"3 hrs", steps:[
      "Open 11 Exam-Style Question Bank (40 Questions)",
      "Pick 12 random problems — 5 minutes each, FBD and support reactions only",
      "Check against worked solutions to secure the 5 free setup marks"
    ]},
    { id:"b22", title:"Component Target Practice", time:"2 hrs", steps:[
      "Go through Exam-Style Question Bank Set B",
      "Solve only the multiple-choice questions from Part I to lock in speed patterns"
    ]},
  ]},
  { week: "Week 8: The Exam Endgame", hours: "Hours 50–56", blocks: [
    { id:"b23", title:"Timed Mock Battle 1", time:"2.5 hrs", steps:[
      "Open 3 Mock Mid-Sem + Final Exam Pack",
      "Run the built-in 120-minute timer in a clean, distraction-free environment",
      "Clear the 10 multiple-choice questions first to bank confidence"
    ]},
    { id:"b24", title:"Diagnostic Correction", time:"2.5 hrs", steps:[
      "Go over mock exam mistakes using the guide's step-by-step solutions",
      "Copy correct structural shapes into a master notebook to clear pattern blind spots"
    ]},
    { id:"b25", title:"Final Blueprint Review", time:"2 hrs", steps:[
      "Open W13 Final Readiness",
      "Keep study confined to the 6 Intuitive Formula Sheet to preserve mental calm before the exam"
    ], milestone:"Exam Ready" },
  ]},
];

const root = document.getElementById('planRoot');
let totalBlocks = 0;

plan.forEach(w => {
  const weekEl = document.createElement('div');
  weekEl.className = 'week';
  weekEl.innerHTML = `<div class="week-head"><span>${w.week}</span><span class="hours">${w.hours}</span></div>`;
  w.blocks.forEach(b => {
    totalBlocks++;
    const blockEl = document.createElement('div');
    blockEl.className = 'block';
    blockEl.id = 'wrap-' + b.id;
    blockEl.innerHTML = `
      <div class="block-title-row" onclick="toggleBlock('${b.id}')">
        <input type="checkbox" id="${b.id}" onclick="event.stopPropagation(); toggleBlock('${b.id}')">
        <span class="block-title">${b.title}${b.milestone ? '<span class=\"milestone-tag\">'+b.milestone+'</span>' : ''}</span>
        <span class="block-time">${b.time}</span>
      </div>
      <ul>${b.steps.map(s => `<li>${s}</li>`).join('')}</ul>
      ${b.reminder ? `<div class="reminder"><strong>Reminder:</strong> ${b.reminder}</div>` : ''}
    `;
    weekEl.appendChild(blockEl);
  });
  root.appendChild(weekEl);
});

document.getElementById('progressLabel').textContent = `0 of ${totalBlocks} blocks complete`;

function updateProgress() {
  const done = plan.flatMap(w => w.blocks).filter(b => localStorage.getItem('statics-' + b.id) === 'true').length;
  document.getElementById('progressFill').style.width = (done / totalBlocks * 100) + '%';
  document.getElementById('progressLabel').textContent = `${done} of ${totalBlocks} blocks complete`;
}

function toggleBlock(id) {
  const cb = document.getElementById(id);
  cb.checked = !cb.checked;
  localStorage.setItem('statics-' + id, cb.checked);
  document.getElementById('wrap-' + id).classList.toggle('done', cb.checked);
  updateProgress();
}

// restore saved state
plan.flatMap(w => w.blocks).forEach(b => {
  if (localStorage.getItem('statics-' + b.id) === 'true') {
    document.getElementById(b.id).checked = true;
    document.getElementById('wrap-' + b.id).classList.add('done');
  }
});
updateProgress();
</script>

</body>
</html>
